name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build
        # Project page được serve tại /<tên-repo>/ nên base phải khớp.
        # Nếu dùng user page (<user>.github.io) thì đổi thành VITE_BASE=/
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Thêm 404.html để hash-router không lỗi khi refresh
        run: cp dist/index.html dist/404.html

      # --- Các bước dưới chỉ chạy khi repo public ---
      # GitHub Pages cho repo private yêu cầu gói Pro/Team. Khi repo còn private,
      # job này dừng ở đây và vẫn xanh (CI: typecheck + build).
      # Đổi repo sang public là deploy tự chạy, không cần sửa gì thêm.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        with:
          # Tự tạo Pages site + đặt source = GitHub Actions, khỏi phải vào Settings bấm tay.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
